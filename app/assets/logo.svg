<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a6baf" />
      <stop offset="100%" stop-color="#7e57c2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Main circle -->
  <circle cx="24" cy="24" r="21" fill="url(#logoGradient)" filter="url(#shadow)" />
  
  <!-- Voice waves -->
  <path d="M34 24c0 2.5-1 4.8-2.7 6.4" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M37 24c0 3.7-1.5 7.1-4 9.5" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />
  <path d="M40 24c0 5-2 9.5-5.3 12.7" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3" />
  
  <!-- Play button triangle -->
  <path d="M19 16v16l14-8z" fill="white" />
  
  <!-- Microphone element -->
  <circle cx="17" cy="24" r="3" fill="white" />
  <path d="M14 27.5v2c0 1.7 1.3 3 3 3s3-1.3 3-3v-2" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M17 32.5v3" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" />
</svg> 